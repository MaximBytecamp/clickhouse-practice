# Временная ветка shots-win: кадры установки Docker Desktop на Windows для главы 0.1а.
# После съёмки ветка удаляется.
name: shots-win
on:
  push:
    branches: [shots-win]
env:
  PYTHONUTF8: "1"
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        shell: powershell
        run: python -m pip install pywinauto pillow
      - name: Съёмка
        shell: powershell
        run: python winrun.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-win
          path: shots-out/
