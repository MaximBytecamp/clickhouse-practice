# Временная ветка shots-win: кадры и прогоны на Windows для главы 0.1а. После съёмки ветка удаляется.
name: shots-win
on:
  push:
    branches: [shots-win]
env:
  PYTHONUTF8: "1"
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, planb]
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        shell: powershell
        run: python -m pip install pywinauto pillow
      - name: Съёмка
        shell: powershell
        run: python winrun3.py ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.mode }}
          path: shots-out/
